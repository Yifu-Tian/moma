map:
  map_type: 2 # 0: Cuboids 1: Bridge 2: Two-vehicle charging scene

fsm:
  waypoint_num : 1
  # [x, y, theta1, theta2, theta3, theta4, theta5, theta6]
  # Target: end-effector tip reaches the charging port on the inner side of vehicle A.
  init_state             : [-3.0, 0.0, 0.0, 60.0, -120.0, 0.0, 0.0, 0.0]
  init_yaw               : 0.0
  init_gripper_close     : false
  waypoint0              : [-1.2772, 0.1800, 1.5247, 122.9353, -79.2760, 0.1616, 15.7374, 0.0]
  waypoint0_yaw          : 0.0
  waypoint0_gripper_close: false

charging_demo:
  auto_trigger: true
  trigger_delay: 2.0
  port_surface_position: [-0.60, 0.25, 0.45]
  goal_position: [-0.60, 0.20, 0.45]
  port_normal: [0.0, -1.0, 0.0]
  min_approach_standoff: 0.02
  allow_port_contact: true
  port_contact_radius: 0.08
  flexible_goal_enabled: true
  flexible_goal_yaw_range: 0.52
  flexible_goal_yaw_samples: 13
  flexible_goal_yaw_weight: 0.15
  ik_goal_enabled: true
  ik_tolerance: 0.02
  ik_damping: 0.002
  ik_step_limit: 0.25
  ik_joint_weight: 0.05
  ik_reference_weight: 0.60
  ik_reference_yaw_weight: 0.50
  ik_max_iterations: 80
  ik_standoff_offsets: [-0.10, 0.0, 0.10]
  ik_lateral_offsets: [-0.08, 0.0, 0.08]
  tip_point_link6: [0.0, 0.0, 0.12]

optimization:
  safe_margin: 0.03
  safe_margin_mani: 0.04
  arm_activation_enabled: true
  manipulator_safe_collision_check: false
  # Far from the charging port, softly keep the arm folded; release it near the port.
  weight_arm_activation: 0.8
  weight_arm_activation_vel: 0.05
  arm_activation_full_dist: 1.20
  arm_activation_release_dist: 0.35
  arm_activation_clearance_dist: 0.55
  arm_activation_clearance_release_dist: 0.25
  arm_activation_collision_skip_weight: 1.10
  arm_activation_folded_deg: [0.0, 60.0, -120.0, 0.0, 0.0, 0.0]
  base_motion_regularization_enabled: false
  weight_base_progress: 25.0
  base_progress_margin: 0.05
  weight_base_yaw_rate: 0.0
  weight_base_yaw_acc: 0.0

search:
  random_seed: 2
  base_only_frontend_enabled: true
  base_only_release_dist: 1.20
  base_only_check_dt: 0.05
  # Allow the base-only frontend even when the final docking IK posture differs
  # from the folded start posture. The folded path is still collision-checked.
  base_only_max_arm_delta: 10.0

mm:
  manipulator_thickness: 0.03
