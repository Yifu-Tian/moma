map:
  map_type: 2 # 0: Cuboids 1: Bridge 2: Two-vehicle charging scene

fsm:
  waypoint_num : 1
  # [x, y, theta1, theta2, theta3, theta4, theta5, theta6]
  # Blocked-start variant: the base starts above the upper vehicle, so the
  # direct path to the charging connector is occluded by the parked vehicle.
  init_state             : [-1.30, 1.15, 0.0, 60.0, -120.0, 0.0, 0.0, 0.0]
  init_yaw               : -90.0
  init_gripper_close     : false
  waypoint0              : [-1.2772, 0.1800, 1.5247, 122.9353, -79.2760, 0.1616, 15.7374, 0.0]
  waypoint0_yaw          : 0.0
  waypoint0_gripper_close: false

charging_demo:
  auto_trigger: true
  trigger_delay: 2.0
  port_surface_position: [-0.60, 0.25, 0.45]
  goal_position: [-0.60, 0.20, 0.45]
  port_normal: [0.0, -1.0, 0.0]
  allow_port_contact: true
  port_contact_radius: 0.08

optimization:
  safe_margin: 0.03
  safe_margin_mani: 0.03

mm:
  manipulator_thickness: 0.03
